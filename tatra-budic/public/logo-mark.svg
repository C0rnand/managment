<svg viewBox="0 0 96 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="markTitle">
  <title id="markTitle">Tatra Budič – emblém</title>
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#153626" />
      <stop offset="100%" stop-color="#0A2118" />
    </linearGradient>
    <linearGradient id="boltFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- shield -->
  <path
    d="M48 2 L90 14 V50 C90 76 72 94 48 102 C24 94 6 76 6 50 V14 Z"
    fill="url(#shieldFill)"
    stroke="#3F7A5C"
    stroke-width="2"
  />
  <path
    d="M48 8 L84 18.5 V50 C84 72.5 68.5 88.5 48 95.8 C27.5 88.5 12 72.5 12 50 V18.5 Z"
    fill="none"
    stroke="#C3DCCC"
    stroke-opacity="0.25"
    stroke-width="1"
  />

  <!-- triple peak -->
  <g stroke="#DCEFE3" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <path d="M18 60 L34 34 L42 45" />
    <path d="M42 60 L58 28 L78 60" />
    <path d="M55 45 L63 36 L72 50" />
  </g>
  <path d="M18 60 L34 34 L42 45 L42 60 Z" fill="#0F2B1D" opacity="0.55" />
  <path d="M42 60 L58 28 L78 60 Z" fill="#143A27" opacity="0.7" />

  <!-- bolt -->
  <path
    d="M57 24 L39 54 L50 54 L45 78 L68 46 L56 46 Z"
    fill="url(#boltFill)"
    filter="url(#boltGlow)"
  />
</svg>
